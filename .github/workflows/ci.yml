name: ci
on: [push, pull_request]
jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
      - name: DB tests (schema, RLS, inventory race, payment idempotency)
        working-directory: tests/db
        env: { PG_BIN: /usr/lib/postgresql/17/bin }
        run: pnpm install --frozen-lockfile && pnpm test
