name: ci
on: [push, pull_request]
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

env:
  # fake, CI-only values; real secrets never live in CI for these jobs
  NODE_ENV: production
  PAYMENTS_STORE: memory
  PAYMENT_PROVIDER: mock
  PAYMENT_MODE: sandbox
  NEXT_PUBLIC_PAYMENT_MODE: sandbox
  ALLOW_MOCK_IN_PRODUCTION: "true"
  SANDBOX_SIMULATOR_ENABLED: "true"
  NEXT_PUBLIC_USE_FIXTURES: "true"
  NEXT_PUBLIC_ALLOW_FIXTURES: "true"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
  NEXT_PUBLIC_DEFAULT_CURRENCY: UZS
  DEFAULT_CURRENCY: UZS
  DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
  SUPABASE_SERVICE_ROLE_KEY: ci-fake
  EMAIL_FROM: ci@dooyoosh.test
  RESEND_API_KEY: re_ci_fake
  CRON_SECRET: ci-cron-secret-0123456789abcdef
  ORDER_TOKEN_SECRET: ci_order_token_secret_0123456789abcdef0123
  PAYMENT_WEBHOOK_SECRET: ci_mock_webhook_secret_0123456789abcdef

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: unit + in-process integration (src/**/*.test.ts, tests/integration, tests/api skips without server)
        run: NODE_ENV=test pnpm test

  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17
      - name: DB tests (migrations 0000+, RLS, grants, stock functions, races, idempotency)
        working-directory: tests/db
        env: { PG_BIN: /usr/lib/postgresql/17/bin }
        run: pnpm install --frozen-lockfile && pnpm test

  api-e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: start server
        run: |
          (pnpm start -p 3000 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/en && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/en || (cat /tmp/server.log; exit 1)
      - name: API tests (contract auth matrix, checkout tampering, webhooks, cron, bundle secrets)
        working-directory: tests/api
        env: { BASE_URL: http://localhost:3000/api/v1, QA_NEXT_DIR: ${{ github.workspace }}/.next }
        run: pnpm install --frozen-lockfile && pnpm exec vitest run
      - name: E2E (chromium x 4 viewports, axe, overflow, links, bag, mock checkout)
        working-directory: tests/e2e
        env: { SITE_URL: http://localhost:3000, QA_LOCALES: en }
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/artifacts
            /tmp/server.log
